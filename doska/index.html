<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6fa" id="themeColor">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Доска">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Доска — Регистрация</title>
 <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/mobile.css">
  
  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")||"light")}catch(e){}</script>
  <script>try{if(localStorage.getItem("userEmail"))location.replace("boards.html")}catch(e){}</script>
  <script src="https://unpkg.com/feather-icons@4.29.0/dist/feather.min.js"></script>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" title="Сменить тему"><i data-feather="moon"></i></button>
<!-- Для кнопки внутри шапки: -->

  <div class="container">
  <h1>Доска</h1>
  <p class="subtitle" id="subtitle">Создайте аккаунт</p>

  <!-- Форма РЕГИСТРАЦИИ -->
  <form id="registerForm">
  <input type="text" id="regName" placeholder="Ваше имя" autocomplete="name" required>
  <input type="email" id="regEmail" placeholder="Email" autocomplete="email" required>
  <input type="password" id="regPassword" placeholder="Пароль" required>
  <input type="password" id="regPassword2" placeholder="Повторите пароль" required>
  <button type="submit">Зарегистрироваться</button>
</form>

  <!-- Форма ВХОДА (скрыта) -->
  <form id="loginForm" style="display: none;">
    <input type="email" id="logEmail" placeholder="Email" required>
    <input type="password" id="logPassword" placeholder="Пароль" required>
    <button type="submit">Войти</button>
  </form>

  <p class="link">
    <span id="linkText">Уже есть аккаунт?</span>
    <a href="#" id="switchLink">Войти</a>
  </p>
</div>

 <script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
