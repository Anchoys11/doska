<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#f5f6fa" id="themeColor">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Доска">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Доска — Рисование</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/board.css">
  <link rel="stylesheet" href="css/toolbar.css">
  <link rel="stylesheet" href="css/sticker.css">
  <link rel="stylesheet" href="css/image.css">
  <link rel="stylesheet" href="css/reactions.css">
  <link rel="stylesheet" href="css/color-picker.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/modal.css"> 
  <link rel="stylesheet" href="css/members.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/mobile.css">
  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")||"light")}catch(e){}</script>
  <script>try{if(!localStorage.getItem("userEmail"))location.replace("index.html")}catch(e){}</script>
  <script src="https://unpkg.com/feather-icons@4.29.0/dist/feather.min.js"></script>
</head>
<body class="board-body">
  <header class="header">
    <div class="header-left">
      <button class="btn-back" id="backBtn"><i data-feather="arrow-left"></i> <span>Назад</span></button>
      <span class="board-name" id="boardName" contenteditable="true">Мозговой штурм</span>
      <span class="role-pill" id="rolePill" title="Ваша роль на этой доске"></span>
    </div>
    <div class="header-right">
      <!-- Кто сейчас на доске -->
      <div class="presence" id="presence"></div>
      <!-- Кнопка участников -->
      <button class="btn-secondary" id="membersBtn">
        <i data-feather="users"></i> <span>Участники</span>
      </button>
      <!-- Кнопка пригласить -->
      <button class="btn-invite" id="inviteBtn"><i data-feather="share-2"></i> <span>Пригласить</span></button>
      <!-- Кнопка темы -->
      <button class="theme-toggle-inline" id="themeToggle"><i data-feather="moon"></i></button>
    </div>
  </header>

  <div class="board-layout">
    <!-- ПАНЕЛЬ ИНСТРУМЕНТОВ -->
    <aside class="toolbar">
      <button class="tool" data-tool="hand" title="Перемещение"><i data-feather="move"></i></button>
      <button class="tool" data-tool="pen" title="Карандаш"><i data-feather="edit-3"></i></button>
      <button class="tool" data-tool="eraser" title="Ластик"><i data-feather="delete"></i></button>
      <button class="tool" data-tool="sticker" title="Заметка"><i data-feather="file-text"></i></button>
      <button class="tool" data-tool="image" title="Картинка"><i data-feather="image"></i></button>
      <button class="tool" data-tool="file" title="Файл"><i data-feather="paperclip"></i></button>

      <div class="toolbar-divider"></div>

      <div class="dropdown" id="sizeDropdown">
        <button class="dropdown-trigger" id="sizeTrigger" title="Толщина"><i data-feather="sliders"></i></button>
        <div class="dropdown-menu size-menu" id="sizeMenu">
          <button class="size-option active" data-size="1"><span style="width:4px;height:4px"></span></button>
          <button class="size-option" data-size="2"><span style="width:8px;height:8px"></span></button>
          <button class="size-option" data-size="4"><span style="width:14px;height:14px"></span></button>
          <button class="size-option" data-size="8"><span style="width:22px;height:22px"></span></button>
        </div>
      </div>

      <div class="dropdown" id="colorDropdown">
        <button class="dropdown-trigger" id="colorTrigger" title="Цвет"><span class="color-dot"></span></button>
        <div class="dropdown-menu color-menu-grid" id="colorMenu">
          <button class="color-grid-item" data-color="#1a1a2e" style="background:#1a1a2e"></button>
          <button class="color-grid-item active" data-color="#7c5cff" style="background:#7c5cff"></button>
          <button class="color-grid-item" data-color="#4a7dff" style="background:#4a7dff"></button>
          <button class="color-grid-item" data-color="#ff5c8a" style="background:#ff5c8a"></button>
          <button class="color-grid-item" data-color="#ffb84a" style="background:#ffb84a"></button>
          <button class="color-grid-item" data-color="#4ad9a0" style="background:#4ad9a0"></button>
          <button class="color-grid-item" data-color="#ff3b3b" style="background:#ff3b3b"></button>
          <button class="color-grid-item" data-color="#ffffff" style="background:#ffffff"></button>
          <button class="color-grid-item plus" id="colorPlus" title="Свой цвет"><i data-feather="plus"></i></button>
        </div>
      </div>

      <div class="dropdown" id="reactionDropdown">
        <button class="dropdown-trigger" id="reactionTrigger" title="Реакции"><i data-feather="smile"></i></button>
        <div class="dropdown-menu reaction-menu" id="reactionMenu">
          <button class="reaction-option" data-emoji="👍">👍</button>
          <button class="reaction-option" data-emoji="❤️">❤️</button>
          <button class="reaction-option" data-emoji="😂">😂</button>
          <button class="reaction-option" data-emoji="🔥">🔥</button>
          <button class="reaction-option" data-emoji="🎉">🎉</button>
          <button class="reaction-option" data-emoji="👏">👏</button>
          <button class="reaction-option" data-emoji="😍">😍</button>
          <button class="reaction-option" data-emoji="🤯">🤯</button>
          <button class="reaction-option" data-emoji="👎">👎</button>
          <button class="reaction-option" data-emoji="💩">💩</button>
          <button class="reaction-option" data-emoji="😢">😢</button>
          <button class="reaction-option" data-emoji="🤔">🤔</button>
          <button class="reaction-option" data-emoji="🤡">🤡</button>
          <button class="reaction-option" data-emoji="🤮">🤮</button>
          <button class="reaction-option" data-emoji="👻">👻</button>
        </div>
      </div>

      <div class="toolbar-divider"></div>
      <button class="tool" id="clearBtn" title="Очистить"><i data-feather="trash-2"></i></button>
    </aside>

    <input type="file" id="imageInput" accept="image/*" hidden>
    <input type="file" id="fileInput" hidden>

    <!-- ХОЛСТ -->
    <div class="canvas-wrapper" id="canvasWrapper">
      <div class="canvas-objects" id="canvasObjects"></div>
      <canvas id="board"></canvas>
    </div>

    <!-- ЧАТ -->
    <aside class="chat collapsed" id="chatPanel">
      <div class="chat-header">
        <h3>Чат</h3>
        <button class="chat-toggle" id="chatToggle"><i data-feather="chevron-right"></i></button>
      </div>
      <div class="chat-messages" id="chatMessages">
        <p class="chat-empty">Сообщений пока нет</p>
      </div>
      <div class="chat-input">
        <div class="chat-emoji-picker">
          <button class="chat-emoji-btn" id="chatEmojiBtn"><i data-feather="smile"></i></button>
          <div class="chat-emoji-menu" id="chatEmojiMenu">
            <button class="chat-emoji-item">😊</button>
            <button class="chat-emoji-item">😂</button>
            <button class="chat-emoji-item">🤣</button>
            <button class="chat-emoji-item">😍</button>
            <button class="chat-emoji-item">🥳</button>
            <button class="chat-emoji-item">😎</button>
            <button class="chat-emoji-item">😢</button>
            <button class="chat-emoji-item">😭</button>
            <button class="chat-emoji-item">😞</button>
            <button class="chat-emoji-item">🥺</button>
            <button class="chat-emoji-item">😡</button>
            <button class="chat-emoji-item">🤬</button>
            <button class="chat-emoji-item">💀</button>
            <button class="chat-emoji-item">🔥</button>
            <button class="chat-emoji-item">❤️</button>
            <button class="chat-emoji-item">👍</button>
            <button class="chat-emoji-item">👎</button>
            <button class="chat-emoji-item">💩</button>
            <button class="chat-emoji-item">👻</button>
            <button class="chat-emoji-item">🤖</button>
            <button class="chat-emoji-item">🍕</button>
            <button class="chat-emoji-item">🚀</button>
          </div>
        </div>
        <input type="text" id="chatInput" placeholder="Написать...">
        <button id="chatSend"><i data-feather="send"></i></button>
      </div>
    </aside>
    <button class="chat-open visible" id="chatOpen"><i data-feather="message-circle"></i></button>
  </div>

  <!-- Модалка участников -->
  <div class="modal-overlay" id="membersModal">
    <div class="modal members-modal">
      <div class="modal-header">
        <div>
          <h2>Участники доски</h2>
          <div class="members-sub" id="membersSub"></div>
        </div>
        <button class="btn-cancel" id="closeMembersBtn" style="padding: 4px 8px;">✕</button>
      </div>
      <div class="members-list" id="membersList"></div>
      <div class="preview-switch" id="previewSwitch"></div>
      <details class="roles-legend" id="rolesLegend">
        <summary>Что может каждая роль</summary>
        <div class="roles-legend-body" id="rolesLegendBody"></div>
      </details>
    </div>
  </div>

  <!-- Добавить участника -->
  <div class="modal-overlay" id="inviteModal">
    <div class="modal">
      <h2>Пригласить на доску</h2>
      <p>Добавьте человека и выберите, что ему можно делать.</p>
      <input type="text" id="inviteName" placeholder="Имя участника" maxlength="30" autocomplete="off">
      <div class="role-selector-wrapper invite-role">
        <select class="member-role-select" id="inviteRole"></select>
        <i data-feather="chevron-down" class="select-icon"></i>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="inviteCopyBtn">Копировать ссылку</button>
        <button class="btn-confirm" id="inviteAddBtn">Добавить</button>
      </div>
    </div>
  </div>

  <!-- Режим «посмотреть как…» -->
  <div class="preview-banner" id="previewBanner">
    <i data-feather="eye"></i>
    <span id="previewText"></span>
    <button type="button" id="previewExit">Вернуться</button>
  </div>

  <!-- Подтверждение очистки -->
  <div class="modal-overlay" id="clearModal">
    <div class="modal">
      <h2>Очистить доску?</h2>
      <p>Все рисунки, заметки, картинки и файлы будут удалены. Это действие нельзя отменить.</p>
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelClearBtn">Отмена</button>
        <button class="btn-confirm btn-danger" id="confirmClearBtn">Очистить</button>
      </div>
    </div>
  </div>

  <!-- Скрипты -->
  <script src="js/common.js"></script>
  <script src="js/board/permissions.js"></script>
  <script src="js/board/canvas.js"></script>
  <script src="js/board/drag.js"></script>
  <script src="js/board/color-picker.js"></script>
  <script src="js/board/stickers.js"></script>
  <script src="js/board/images.js"></script>
  <script src="js/board/files.js"></script>
  <script src="js/board/reactions.js"></script>
  <script src="js/board/ui.js"></script>
  <script src="js/board/chat.js"></script>
  <script src="js/board/file-logic.js"></script>
  <script src="js/board/main.js"></script>
  <script>if (window.feather) feather.replace()</script>
</body>
</html>
