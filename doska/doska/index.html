<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Доска — Регистрация</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <button class="theme-toggle" id="themeToggle" title="Сменить тему">🌙</button>

  <div class="container">
    <h1>Доска</h1>
    <p class="subtitle">Создайте аккаунт</p>

    <form id="registerForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Пароль" required>
      <input type="password" id="password2" placeholder="Повторите пароль" required>
      <button type="submit">Зарегистрироваться</button>
    </form>

    <p class="link">
      Уже есть аккаунт? <a href="boards.html">Войти</a>
    </p>
  </div>

 <script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
