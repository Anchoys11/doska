<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Доска — Мои доски</title>
  <link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/boards.css">
</head>
<body class="app-body">
  <header class="header">
    <div class="logo">Доска</div>
    <div class="header-right">
      <span class="user-email" id="userEmail">user@mail.com</span>
      <button class="theme-toggle-inline" id="themeToggle" title="Сменить тему">🌙</button>
      <button class="btn-logout" id="logoutBtn">Выйти</button>
    </div>
  </header>

  <main class="main">
    <div class="main-header">
      <h2>Мои доски</h2>
      <button class="btn-create" id="createBtn">+ Создать доску</button>
    </div>

    <div class="boards-grid" id="boardsGrid">
      <!-- Сюда JS будет вставлять доски -->
    </div>

    <p class="empty" id="emptyMessage">У вас пока нет досок. Создайте первую!</p>
  </main>

  <script src="js/common.js"></script>
  <script src="js/boards.js"></script>
</body>
</html>
